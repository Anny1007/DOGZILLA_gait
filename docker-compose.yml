services:
  gait:
    image: dogzilla-sim:humble          # 與 ../DOGZILLA/sim_env 共用映像 (在那邊 ./run.sh build)
    container_name: dogzilla-gait
    network_mode: host
    privileged: true
    shm_size: '2gb'
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=30
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # 與主專案共用已編譯的 CHAMP 工作區 (在 ../DOGZILLA/sim_env 執行 ./run.sh colcon)
      - ../DOGZILLA/vendor/Program/yahboomcar_ws_ros2:/ws
      # 官方 S1 模型直接引用主專案, 本資料夾只加光達負載 (description/)
      - ../DOGZILLA/sim_env/description:/description_base:ro
      - ./description:/description
      - ./config:/config                # 步態與關節 PID 是複製來的, 之後改步態不會影響主專案
      - ./launch:/launch
      - ./worlds:/worlds
      - ./tools:/tools
      - ./results:/results
      - ./logs:/logs
    stdin_open: true
    tty: true
    command: bash
